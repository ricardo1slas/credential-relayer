server:
  port: 8080
  read_timeout: 10s
  write_timeout: 10s

auth:
  api_keys:
    - name: "dev-client"
      key: "<revoked-dev-key>"

rate_limit:
  requests: 100
  window: 60s

relay:
  targets:
    - name: "httpbin"
      url: "https://httpbin.org"
      timeout: 5s
      retries: 3

queue:
  redis:
    addr: "localhost:6379"
    password: ""
    db: 0
  workers: 5
  retry_delay: 30s

metrics:
  enabled: true
  port: 9090
