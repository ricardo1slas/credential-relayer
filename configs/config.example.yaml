# Every option can be overridden with a RELAYER_* env var, "__" between levels:
#   RELAYER_RATE_LIMIT__FAIL_OPEN=true -> rate_limit.fail_open
#   RELAYER_SERVER_PORT=8081 -> server.port (single "_" works only when no key on the path has one)
# Lists (auth.api_keys, relay.targets) can only be set here.

server:
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  read_header_timeout: 5s

auth:
  api_keys:
    - name: "my-client"
      key: "replace-me-with-a-random-secret"   # dev only; the relayer refuses keys under 32 characters
      targets: ["httpbin"]   # least privilege: relay names this key may use ([] or ["*"] = all)

rate_limit:
  requests: 100
  window: 60s
  # redis (default): one budget per key shared by every instance. Redis is always
  # configured (the queue needs it), so this is effectively the default.
  # memory: per process, so N instances allow N x the limit. Single-instance only.
  backend: redis
  # On a Redis error: false (default) refuses with 503, true lets the request through.
  # Either way it is logged and counted in relayer_ratelimit_backend_errors_total.
  fail_open: false

relay:
  # Inbound request body cap -- rejects anything larger with 413.
  max_request_bytes: 1048576     # 1 MiB
  # Target response body cap -- truncates anything larger.
  max_response_bytes: 10485760   # 10 MiB
  # Outbound User-Agent sent to targets (overrides whatever the client sent).
  user_agent: "credential-relayer/0.1"
  # Max HTTP redirects to follow per request.
  max_redirects: 3
  # If false (default), the relay strips User-Agent, Referer, and hop-by-hop headers
  # from the client before forwarding. Set true ONLY if a target requires the real UA.
  preserve_client_identity: false
  targets:
    - name: "httpbin"
      url: "https://httpbin.org"
      timeout: 5s
      retries: 3
      # allow_http: true           # permit http:// scheme (default: reject)
      # allow_private_ips: true    # permit RFC1918/loopback/link-local (default: reject)
      # preserve_user_agent: true  # per-target override for preserve_client_identity
      # Credentials the relay injects on every request to this target. Values are the NAMES of
      # env vars (infra/docker/.env.relayer), never the secrets themselves. Clients can't read,
      # override or redirect them, and echoed values are redacted from responses.
      # secret_headers:
      #   X-Api-Key: HTTPBIN_API_KEY
      # Request policy (checked on /relay, on /webhook before enqueue, and again in the worker).
      # Empty = no restriction. Paths are prefixes on segment boundaries, matched after "../"
      # resolution; encoded dots/slashes, backslashes and ";" are refused when allow_paths is set.
      # allow_methods: ["GET", "POST"]      # else 403
      # allow_paths: ["/get", "/post"]      # else 403
      # max_body_bytes: 65536               # else 413 (per target, below max_request_bytes)
      # Streaming proxy: /api/v1/proxy/httpbin/get forwards to https://httpbin.org/get as-is.
      # `timeout` bounds the whole stream there, so LLM targets want a long one (e.g. 600s).

queue:
  redis:
    addr: "localhost:6379"
    password: ""
    db: 0
    # Set true when connecting to Redis with in-transit encryption
    # (e.g. ElastiCache with transit_encryption_enabled).
    tls: false
  workers: 5
  retry_delay: 30s
  # TTL for completed job metadata. Body is cleared on completion regardless.
  completed_ttl: 1h
  # TTL for failed/dead jobs (keeps body + headers for debugging).
  failed_ttl: 24h

metrics:
  # pprof: false   # expose /debug/pprof on the metrics port (never publicly)
  enabled: true
  port: 9090
