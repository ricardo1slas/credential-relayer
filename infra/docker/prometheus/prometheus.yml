global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: relayer
    # The relayer serves /metrics on its dedicated metrics port (9090), kept off
    # the public :8080 listener. On the compose network it resolves by service name.
    static_configs:
      - targets: ["relayer:9090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
