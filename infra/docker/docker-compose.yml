services:
  redis:
    image: redis:7-alpine
    container_name: relayer-redis
    restart: unless-stopped
    # Run as the redis user directly so the entrypoint doesn't need CAP_SETUID to drop privs.
    user: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  relayer:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: credential-relayer:local
    container_name: relayer
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RELAYER_QUEUE_REDIS_ADDR: redis:6379
    # Upstream secrets referenced by secret_headers in config.yaml (gitignored; see README).
    # Separate from .env so the relayer never receives the SMTP/Grafana credentials.
    env_file:
      - path: .env.relayer
        required: false
    ports:
      - "${BIND_IP:-127.0.0.1}:8080:8080"
    volumes:
      - ../../configs/config.yaml:/app/configs/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Host metrics for the Pi dashboard. pid: host and a read-only view of / are what node_exporter
  # needs to see host CPU, memory and filesystems; no port is published (Prometheus scrapes it on
  # the compose network). Network-interface stats would need host networking, deliberately not
  # used, so they are absent.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: relayer-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|snap/.+)($$|/)"
    pid: host
    volumes:
      - /:/host:ro,rslave
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 50

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: relayer-prometheus
    restart: unless-stopped
    depends_on:
      - relayer
      - alertmanager
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # 35d: the 30-day SLO panels need a full window. The size cap protects the SD card.
      - "--storage.tsdb.retention.time=35d"
      - "--storage.tsdb.retention.size=1GB"
      # Count a counter's first increments: without this, increase() misses the events that
      # create a series (e.g. the first 3 refusals of a new reason read as 0).
      - "--enable-feature=created-timestamp-zero-ingestion"
    ports:
      - "${BIND_IP:-127.0.0.1}:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: relayer-alertmanager
    restart: unless-stopped
    # Set SMTP_USER / SMTP_PASS (app password) / ALERT_EMAIL in infra/docker/.env
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com:587}
      SMTP_USER: ${SMTP_USER:-unset@localhost.invalid}
      SMTP_PASS: ${SMTP_PASS:-unset}
      ALERT_EMAIL: ${ALERT_EMAIL:-unset@localhost.invalid}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s|__SMTP_HOST__|$$SMTP_HOST|" -e "s|__SMTP_USER__|$$SMTP_USER|g"
        -e "s|__SMTP_PASS__|$$SMTP_PASS|" -e "s|__ALERT_EMAIL__|$$ALERT_EMAIL|"
        /etc/alertmanager/alertmanager.tmpl.yml > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "${BIND_IP:-127.0.0.1}:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.tmpl.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
      - alertmanager-data:/alertmanager
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100

  grafana:
    image: grafana/grafana:11.4.0
    container_name: relayer-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # admin/admin is a DEV-ONLY default for `make docker-up`; `make deploy-pi` refuses it.
      # Applied only when the grafana-data volume is first created (see docs/pi-deploy.md).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${BIND_IP:-127.0.0.1}:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 200

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
