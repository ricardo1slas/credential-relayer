services:
  redis:
    image: redis:7-alpine
    container_name: relayer-redis
    restart: unless-stopped
    # Run as the redis user directly so the entrypoint doesn't need CAP_SETUID to drop privs.
    user: redis
    ports:
      - "${BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  relayer:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: private-relayer:local
    container_name: relayer
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RELAYER_QUEUE_REDIS_ADDR: redis:6379
    ports:
      - "${BIND_IP:-127.0.0.1}:8080:8080"
    volumes:
      - ../../configs/config.yaml:/app/configs/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: relayer-prometheus
    restart: unless-stopped
    depends_on:
      - relayer
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "${BIND_IP:-127.0.0.1}:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200

  grafana:
    image: grafana/grafana:11.4.0
    container_name: relayer-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${BIND_IP:-127.0.0.1}:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 200

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
