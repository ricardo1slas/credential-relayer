# Placeholders are filled from env by the compose entrypoint (Alertmanager has no env expansion).
global:
  smtp_smarthost: '__SMTP_HOST__'
  smtp_from: '__SMTP_USER__'
  smtp_auth_username: '__SMTP_USER__'
  smtp_auth_password: '__SMTP_PASS__'
  smtp_require_tls: true

route:
  receiver: email
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: '__ALERT_EMAIL__'
        send_resolved: true
