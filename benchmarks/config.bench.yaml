# Throwaway benchmark config. NOT for production: rate limit is effectively off,
# and the mock target needs http + private IP (SSRF guards relaxed for it only).
server:
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  read_header_timeout: 5s

auth:
  api_keys:
    - name: "bench"
      key: "bench-key-not-a-secret-000000000000"   # stack is tailnet-only and torn down after each run

rate_limit:
  requests: 100000000
  window: 60s

relay:
  max_request_bytes: 1048576
  max_response_bytes: 10485760
  user_agent: "credential-relayer-bench"
  max_redirects: 0
  targets:
    - name: "mock"
      url: "http://mock:80"
      timeout: 5s
      retries: 0
      allow_http: true
      allow_private_ips: true

queue:
  redis:
    addr: "redis:6379"
  workers: 5
  retry_delay: 30s
  completed_ttl: 1h
  failed_ttl: 1h

metrics:
  enabled: true
  port: 9090
  pprof: true
