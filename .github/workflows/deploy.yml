name: deploy-pi

# Auto-deploy to the Raspberry Pi on every push to main, over Tailscale.
# The runner joins the tailnet as tag:ci (ephemeral) and runs `make deploy-pi`
# (rsync + docker compose up --build on the Pi). Auth is Tailscale SSH: the
# policy must grant tag:ci -> tag:pi (tcp:22, tcp:8080) and an ssh accept rule.
# See docs/hardening.md for the exact policy. PI_HOST defaults to the Pi's tailnet IP
# (no MagicDNS dependency on the runner).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'ricardo1slas/private_relayer'
    steps:
      - uses: actions/checkout@v4

      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust Pi host key (Tailscale SSH, identity-authenticated)
        run: |
          mkdir -p ~/.ssh
          printf 'Host *\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config

      - name: Deploy
        run: make deploy-pi PI=<pi-user>@${{ vars.PI_HOST || '<pi-tailnet-ip>' }}

      - name: Smoke test
        run: |
          host=${{ vars.PI_HOST || '<pi-tailnet-ip>' }}
          for i in $(seq 10); do
            curl -fsS -m 5 http://$host:8080/ready && exit 0
            sleep 3
          done
          exit 1
