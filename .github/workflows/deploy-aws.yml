name: deploy-aws-dev

# Manual only (AWS credits ran out; the Pi deploy in deploy.yml is the default).
# Prod is intentionally not wired -- see how_to.md §12.
on:
  workflow_dispatch:

# OIDC: id-token write is the magic that lets us hand a JWT to AWS STS
# in exchange for short-lived credentials. No long-lived AWS keys anywhere.
permissions:
  contents: read
  id-token: write

# One deploy at a time per env. Don't cancel an in-flight rollout.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: relayer-dev
  ECS_CLUSTER: relayer-dev-cluster
  ECS_SERVICE: relayer-dev
  ECS_TASK_FAMILY: relayer-dev
  CONTAINER_NAME: relayer-dev

jobs:
  deploy:
    name: build + push + deploy
    runs-on: ubuntu-latest
    # Only deploy from the canonical repo. A fork running this workflow
    # would not have the OIDC trust, so this guard mostly prevents wasted
    # runner minutes / confusing error messages.
    if: github.repository == 'ricardo1slas/private_relayer'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build + push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull current task def, swap the image, register a new revision.
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --query taskDefinition > task-def.json

      - name: Render task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}

      - name: Deploy to ECS + wait for stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          # If the new task fails ALB health checks, ECS rolls back automatically;
          # this flag fails the workflow so we see it instead of silently succeeding.
          force-new-deployment: false
