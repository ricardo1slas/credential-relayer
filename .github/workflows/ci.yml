name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Must be compiled with Go ≥ the version in go.mod. Local is v2.11.4
          # via brew; pin to match so CI failures mirror local.
          version: v2.11.4
          args: --timeout=5m

  test:
    name: test (with redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod download
        run: go mod download
      - name: go test
        # Queue tests read TEST_REDIS_ADDR, falling back to localhost:6379
        # which is where the service container is mapped.
        shell: bash # -o pipefail, so a test failure still fails through tee
        run: go test -race -count=1 -timeout=3m -coverprofile=coverage.out -covermode=atomic ./... | tee test.out
      - name: coverage summary
        run: |
          {
            echo "### Coverage: $(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')"
            echo '| package | coverage |'
            echo '|---|---|'
            sed -nE 's/^(ok)?[[:space:]]+([^[:space:]]+).*coverage: ([0-9.]+%).*/| \2 | \3 |/p' test.out
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          load: true
          tags: credential-relayer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test image
        run: |
          docker run --rm --entrypoint /app/relayer credential-relayer:ci --help 2>&1 || true
          docker image inspect credential-relayer:ci --format '{{.Config.User}} {{.Config.ExposedPorts}}'
