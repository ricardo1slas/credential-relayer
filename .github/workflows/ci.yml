name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          # Must be compiled with Go ≥ the version in go.mod. Local is v2.11.4
          # via brew; pin to match so CI failures mirror local.
          version: v2.11.4
          args: --timeout=5m

  test:
    name: test (with redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod download
        run: go mod download
      - name: go test
        # Queue tests read TEST_REDIS_ADDR, falling back to localhost:6379
        # which is where the service container is mapped.
        run: go test -race -count=1 -timeout=3m ./...

  build:
    name: build (docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          load: true
          tags: private-relayer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test image
        run: |
          docker run --rm --entrypoint /app/relayer private-relayer:ci --help 2>&1 || true
          docker image inspect private-relayer:ci --format '{{.Config.User}} {{.Config.ExposedPorts}}'
