name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Must be compiled with Go ≥ the version in go.mod. Local is v2.11.4
          # via brew; pin to match so CI failures mirror local.
          version: v2.11.4
          args: --timeout=5m

  test:
    name: test (with redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod download
        run: go mod download
      - name: go test
        # Queue tests read TEST_REDIS_ADDR, falling back to localhost:6379
        # which is where the service container is mapped.
        # -coverpkg credits every package with coverage from any test, so internal/api
        # counts what test/e2e exercises through the real router.
        run: go test -race -count=1 -timeout=3m -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...
      - name: coverage summary
        # Per package from the merged profile; go test's own per-package lines are relative
        # to all of ./... under -coverpkg. Blocks can repeat across test binaries: counted once.
        run: |
          {
            echo "### Coverage: $(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')"
            echo '| package | coverage |'
            echo '|---|---|'
            awk 'NR > 1 {
              p = $1; sub(/\/[^\/]*:.*/, "", p); sub(/^github.com\/ricardo1slas\/credential-relayer\//, "", p)
              n[$1] = $2; pkg[$1] = p; if ($3 > 0) hit[$1] = 1
            }
            END {
              for (b in n) { t[pkg[b]] += n[b]; if (b in hit) c[pkg[b]] += n[b] }
              for (p in t) printf "| %s | %.1f%% |\n", p, 100 * c[p] / t[p]
            }' coverage.out | sort
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          load: true
          tags: credential-relayer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test image
        run: |
          docker run --rm --entrypoint /app/relayer credential-relayer:ci --help 2>&1 || true
          docker image inspect credential-relayer:ci --format '{{.Config.User}} {{.Config.ExposedPorts}}'
